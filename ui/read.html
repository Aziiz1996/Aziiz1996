<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قارئ أحببتها حتى خسرت نفسي</title><link rel="stylesheet" href="/style.css"></head><body><main class="reader-shell"><header class="reader-head"><a href="/">المكتبة</a><h1>أحببتها حتى خسرت نفسي</h1><button id="pagesButton" type="button">كل الصفحات</button></header><nav class="reader-controls" aria-label="أدوات القراءة"><label class="sr-only" for="chapter">اختر الفصل</label><select id="chapter"><option value="1">الغلاف · الصفحة ١</option></select><form class="jump" id="jump"><label for="pageNumber">اذهب لصفحة</label><input id="pageNumber" type="number" min="1" max="101" value="1" inputmode="numeric"><button type="submit">افتح</button><button id="zoom" type="button" aria-label="تكبير الصفحة">تكبير ＋</button></form></nav><div id="status" class="status" role="status" aria-live="polite">الغلاف جاهز للقراءة</div><div id="stage" class="stage" aria-busy="false"><img id="pageImage" class="page-image" src="/pages/1.jpg" alt="غلاف الرواية — الصفحة ١" width="868" height="1225"></div><nav class="pager" aria-label="تقليب الصفحات"><button id="previous" type="button" disabled>السابق →</button><span class="page-count" id="pageCount">١ من ١٠١</span><button id="next" type="button">← التالي</button></nav><noscript><p>الغلاف ظاهر. فعّل JavaScript لاختيار الصفحات وتقليبها.</p></noscript></main><dialog id="pagesDialog" aria-labelledby="pagesTitle"><div class="dialog-head"><h2 id="pagesTitle">اختر صفحتك</h2><button id="closePages" type="button">إغلاق</button></div><div id="thumbnails" class="thumbnails"></div></dialog><script src="/reader.js" defer></script></body></html>
